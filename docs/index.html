<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Picture Of The Day</title>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --card: #f5f5f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #eaeaea;
        --card: #1e1e1e;
      }
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: sans-serif;
      max-width: 1200px;
      margin: auto;
      padding: 1em;
    }
    input {
      width: calc(100% - 3em);
      padding: 0.5em;
      margin: 1em;
    }
    #gallery {
      columns: 240px;
      column-gap: 1em;
    }
    #gallery details {
      display: inline-block;
      background: var(--card);
      margin-bottom: 1em;
      border-radius: 0.5em;
      overflow: clip;
    }
    #gallery details summary {
      padding: 1em;
    }
    #gallery details p {
      padding: 0em 1em 1em 1em;
      opacity: 0.7;
      font-size: 0.7em;
    }
    #gallery details a img {
      max-width: 100%;
      display: block;
    }
  </style>

  <body>
    <h1>Picture Of The Day</h1>
    <input id="search" placeholder="Search" />
    <div id="gallery"></div>
  </body>

  <script>
    let items = [];
    fetch("archive.json")
      .then((r) => r.json())
      .then((data) => {
        items = data;
        render(data);
      });

    function render(data) {
      const date = items[0]?.date;
      gallery.innerHTML = data
        .map(
          (item) => `<details ${item.date === date ? "open" : ""}>
            <summary>
              <a href="${item.pageUrl}">${item.source} (${item.date})</a>
            </summary>
            <p>${item.description}</p>
            <a href="${item.imageUrl}"><img src="${item.imageUrl}" alt="${item.id}"></a>
          </details>`,
        )
        .join("");
    }

    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll("#gallery details").forEach((el) => {
        el.hidden = !el.textContent.toLowerCase().includes(q);
      });
    });
  </script>
</html>
