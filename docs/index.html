<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Picture Of The Day</title>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --card: #f5f5f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #eaeaea;
        --card: #1e1e1e;
      }
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: sans-serif;
      max-width: 1200px;
      margin: auto;
      padding: 1em;
    }
    input {
      width: calc(100% - 3em);
      padding: 0.5em;
      margin: 1em;
    }
    #gallery details {
      width: calc((100% - 2em) / 3);
    }
    @media (max-width: 900px) {
      #gallery details {
        width: calc((100% - 1em) / 2);
      }
    }
    @media (max-width: 600px) {
      #gallery details {
        width: 100%;
      }
    }
    #gallery details {
      background: var(--card);
      margin-bottom: 1em;
      border-radius: 0.5em;
      overflow: clip;
    }
    #gallery details summary {
      padding: 1em;
    }
    #gallery details summary a {
      color: inherit;
      text-decoration: none;
    }
    #gallery details p {
      padding: 0em 1em 1em 1em;
      opacity: 0.7;
      font-size: 0.7em;
    }
    #gallery details a img {
      max-width: 100%;
      display: block;
    }
  </style>

  <body>
    <h1>Picture Of The Day</h1>
    <input id="search" placeholder="Search" />
    <div id="gallery"></div>
  </body>

  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
  <script>
    let items = [];
    search = document.getElementById("search");
    gallery = document.getElementById("gallery");
    let masonry = new Masonry(gallery, {
      itemSelector: "details",
      columnWidth: "details",
      percentPosition: true,
      gutter: 16,
    });

    fetch("archive.json")
      .then((r) => r.json())
      .then((data) => {
        items = data;
        render(data);
        masonry.reloadItems();
        masonry.layout();
      });

    function render(data) {
      const date = items[0]?.date;
      gallery.innerHTML = data
        .map(
          (item) => `<details ${item.date === date ? "open" : ""}>
            <summary>
              <a href="${item.pageUrl}">${item.source} (${item.date})</a>
            </summary>
            <p>${item.description}</p>
            <a href="${item.imageUrl}"><img src="${item.imageUrl}" alt="${item.id}"></a>
          </details>`,
        )
        .join("");
    }

    function updateLayout() {
      if (masonry) masonry.layout();
    }

    function filter(e) {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll("#gallery details").forEach((el) => {
        el.hidden = !el.textContent.toLowerCase().includes(q);
      });
      updateLayout();
    }

    search.addEventListener("input", filter);
    gallery.addEventListener("toggle", updateLayout, true);
  </script>
</html>
